[project]
description: "libfwps is a library for Windows Property Store data types."
name: "libfwps"
status: "alpha"
year_of_creation: "2013"
documentation_url: "https://github.com/libyal/libfwps/tree/master/documentation"
features: ["debug_output", "ossfuzz", "python_bindings"]

[library]
description: "Library to access the Windows Property Store format"
public_types: ["record", "set", "store"]
tests: ["error", "notify", "property_identifier", "record", "set", "store", "support"]

[python_module]
tests: ["record", "set", "store", "support"]

[tests]
profiles: ["libfwps", "pyfwps"]
options_per_profile: ["", ""]

